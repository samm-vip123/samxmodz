<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMM X MODZ | Premium Cyber Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc; --primary-dark: #00b38f; --secondary: #ff0055;
            --bg-dark: #030305; --glass-bg: rgba(10, 10, 15, 0.7); --glass-border: rgba(0, 255, 204, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Hiệu ứng nền chuyển động */
        body { 
            font-family: 'Roboto', sans-serif; color: #fff; background-color: var(--bg-dark); 
            min-height: 100vh; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.08), transparent 25%);
        }

        /* Video nền (Bị ẩn đi, chỉ dùng âm thanh hoặc làm nền mờ) */
        #bg-video { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: -2; opacity: 0.4; filter: blur(3px); 
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(3,3,5,0.6), var(--bg-dark)); z-index: -1; }

        /* Thanh Điều Hướng */
        header {
            background: rgba(3, 3, 5, 0.8); backdrop-filter: blur(20px); padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100;
            box-shadow: 0 5px 30px rgba(0, 255, 204, 0.15);
        }
        .logo { 
            font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; 
            background: linear-gradient(90deg, #fff, var(--primary), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px var(--primary)); letter-spacing: 2px;
        }
        .auth-buttons { display: flex; gap: 15px; align-items: center; }
        .btn-music { 
            background: rgba(255, 0, 85, 0.2); color: var(--secondary); border: 1px solid var(--secondary); 
            padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn-music:hover { background: var(--secondary); color: #fff; box-shadow: 0 0 15px var(--secondary); }
        .auth-buttons button:not(.btn-music) {
            background: transparent; color: var(--primary); border: 1px solid var(--primary);
            padding: 8px 20px; border-radius: 5px; cursor: pointer;
            font-family: 'Orbitron', sans-serif; font-weight: 700; transition: all 0.4s ease;
        }
        .auth-buttons button:not(.btn-music):hover { 
            background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); transform: translateY(-2px);
        }

        .container { padding: 40px 5%; max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }
        
        h2 { 
            font-family: 'Orbitron', sans-serif; font-size: 24px; margin-top: 60px; margin-bottom: 30px; 
            display: flex; align-items: center; text-transform: uppercase; letter-spacing: 2px;
        }
        h2::before { 
            content: ''; display: inline-block; width: 8px; height: 30px; 
            background: var(--primary); margin-right: 15px; 
            box-shadow: 0 0 20px var(--primary); border-radius: 4px;
        }

        /* Lưới File Game 3D */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
        .file-card {
            background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px;
            text-align: center; backdrop-filter: blur(15px); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden; opacity: 0; transform: translateY(30px);
            animation: fadeUp 0.8s forwards; animation-delay: calc(var(--i) * 0.15s);
        }
        .file-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 204, 0.1), transparent);
            transform: translateX(-100%); transition: 0.5s;
        }
        .file-card:hover { transform: translateY(-15px) scale(1.03); box-shadow: 0 20px 40px rgba(0, 255, 204, 0.2); border-color: var(--primary); }
        .file-card:hover::before { transform: translateX(100%); }
        
        .img-wrapper { position: relative; width: 100%; height: 200px; overflow: hidden; border-bottom: 2px solid var(--primary); }
        .file-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .file-card:hover .file-img { transform: scale(1.1); }
        .file-info { padding: 25px; }
        .file-card h3 { font-family: 'Orbitron', sans-serif; font-size: 20px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px var(--primary); }
        .file-card p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .file-card a {
            display: inline-block; background: transparent; color: var(--primary); 
            border: 2px solid var(--primary); padding: 12px 35px; border-radius: 30px; 
            text-decoration: none; font-weight: 900; font-size: 15px; transition: 0.4s; position: relative; overflow: hidden;
        }
        .file-card a:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }

        /* Box Zalo */
        .box-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .zalo-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 20px; border-radius: 15px; text-decoration: none;
            display: flex; align-items: center; gap: 15px; font-weight: 500; transition: 0.4s;
        }
        .zalo-box:hover { background: rgba(0, 255, 204, 0.1); transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,255,204,0.1); }
        .zalo-icon { width: 40px; height: 40px; background: #fff; border-radius: 50%; color: #0068ff; display: flex; justify-content: center; align-items: center; font-weight: 900; font-family: 'Orbitron'; font-size: 18px; }
        .vip { border-color: #ff9800; background: rgba(255, 152, 0, 0.05); }
        .vip .zalo-icon { color: #ff9800; }
        .vip:hover { background: rgba(255, 152, 0, 0.15); box-shadow: 0 0 20px rgba(255, 152, 0, 0.3); border-color: #ff9800; }

        /* Panel Thông tin */
        .glass-panel { background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; backdrop-filter: blur(15px); }
        .info-panel p { margin-bottom: 15px; font-size: 16px; color: #ccc; display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 10px;}
        .info-panel strong { color: var(--primary); font-family: 'Orbitron'; }

        /* Chat Bot & Modal */
        .chat-bot-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
        .chat-icon { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 30px rgba(0, 255, 204, 0.5); font-size: 30px; transition: 0.4s; }
        .chat-icon:hover { transform: scale(1.1) rotate(15deg); box-shadow: 0 0 40px var(--primary); }
        .chat-window { display: none; position: absolute; bottom: 85px; right: 0; width: 350px; background: rgba(5, 5, 10, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--primary); border-radius: 20px; overflow: hidden; box-shadow: 0 15px 50px rgba(0,0,0,0.8); }
        .chat-header { background: var(--primary); color: #000; padding: 15px; font-weight: 900; font-family: 'Orbitron'; text-align: center; }
        .chat-body { height: 300px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .chat-msg { padding: 12px 16px; border-radius: 15px; font-size: 14px; max-width: 85%; line-height: 1.4; }
        .chat-msg.bot { background: rgba(0, 255, 204, 0.1); color: var(--primary); border: 1px solid var(--primary); align-self: flex-start; border-bottom-left-radius: 0; }
        .chat-msg.user { align-self: flex-end; background: rgba(255, 255, 255, 0.1); border-bottom-right-radius: 0; }
        .chat-input-area { display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
        .chat-input-area input { flex: 1; padding: 15px; border: none; background: transparent; color: white; outline: none; }
        .chat-input-area button { background: var(--primary); color: #000; border: none; padding: 0 20px; cursor: pointer; font-weight: 900; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: linear-gradient(145deg, rgba(20,20,30,0.95), rgba(5,5,10,0.95)); border: 1px solid var(--primary); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; box-shadow: 0 0 50px rgba(0, 255, 204, 0.2); }
        .modal-content h3 { color: var(--primary); font-family: 'Orbitron'; margin-bottom: 30px; font-size: 22px; }
        .modal-content input { width: 100%; padding: 15px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; outline: none; transition: 0.3s; }
        .modal-content input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .modal-content button { width: 100%; padding: 15px; background: var(--primary); border: none; color: #000; font-weight: 900; border-radius: 8px; cursor: pointer; margin-top: 20px; font-family: 'Orbitron'; transition: 0.3s; }
        .modal-content button:hover { background: #fff; box-shadow: 0 0 20px var(--primary); }
        .close-btn { position: absolute; top: 15px; right: 20px; color: #fff; cursor: pointer; font-size: 24px; transition: 0.3s; }
        .close-btn:hover { color: var(--secondary); transform: rotate(90deg); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--primary-dark); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body>
    <!-- Video ẩn để lấy nhạc, hiển thị mờ làm nền -->
    <video autoplay loop playsinline id="bg-video" style="pointer-events: none;">
        <source src="https://files.catbox.moe/yd6xhn.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <header>
        <div class="logo">SAMM X MODZ</div>
        <div class="auth-buttons" id="authButtons">
            <button class="btn-music" onclick="toggleMusic()" id="musicBtn">Bật Nhạc</button>
            <button onclick="openModal('Đăng Nhập')">Đăng Nhập</button>
            <button onclick="openModal('Đăng Ký')">Đăng Ký</button>
        </div>
    </header>

    <div class="container">
        <h2>KHO TẢI GAME</h2>
        <div class="file-grid" id="fileContainer">
            <!-- File load từ Backend -->
        </div>

        <h2>KHU VỰC BOX ZALO</h2>
        <div class="box-grid">
            <a href="https://zalo.me/g/wqnmgz1abybxpub2p9w9" target="_blank" class="zalo-box"><div class="zalo-icon">Z</div> Box 1</a>
            <a href="https://zalo.me/g/pptuksfrskl7sotde7am" target="_blank" class="zalo-box"><div class="zalo-icon">Z</div> Box 2</a>
            <a href="https://zalo.me/g/s7dslaz2mkhxgn9dfntj" target="_blank" class="zalo-box vip"><div class="zalo-icon">V</div> BOX VIP SAMM X MODZ</a>
        </div>

        <h2>THÔNG TIN TÀI KHOẢN</h2>
        <div class="glass-panel info-panel" id="accountInfo">
            <p><span>Tên đăng nhập:</span> <strong id="displayUsername">Khách</strong></p>
            <p><span>Trạng thái:</span> <strong id="displayStatus" style="color: #ff4444;">Chưa đăng nhập</strong></p>
            <p style="border: none;"><span>Hỗ trợ:</span> <strong>ZALO 0355757211</strong></p>
        </div>
    </div>

    <div class="chat-bot-container">
        <div class="chat-icon" onclick="toggleChat()">🤖</div>
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">BOT SAMM</div>
            <div class="chat-body" id="chatBody">
                <div class="chat-msg bot">Gõ <b>/start</b> để xem thông tin.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Nhập..." onkeypress="handleChat(event)">
                <button onclick="sendChat()">Gửi</button>
            </div>
        </div>
    </div>

    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">ĐĂNG NHẬP</h3>
            <input type="text" id="username" placeholder="Tài khoản">
            <input type="password" id="password" placeholder="Mật khẩu">
            <button onclick="submitAuth()">XÁC NHẬN</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://samxmodz-api.onrender.com'; // SỬA LINK RENDER CỦA BẠN VÀO ĐÂY

        // Load File từ Backend
        async function loadFiles() {
            try {
                const response = await fetch(API_URL + '/api/files');
                const files = await response.json();
                const container = document.getElementById('fileContainer');
                
                if(files.length > 0) {
                    container.innerHTML = ''; 
                    files.forEach((file, index) => {
                        container.innerHTML += `
                            <div class="file-card" style="--i: ${index}">
                                <div class="img-wrapper">
                                    <img src="${file.imageUrl}" alt="Game" class="file-img" onerror="this.src='https://i.ibb.co/680hYh2/freefire.jpg'">
                                </div>
                                <div class="file-info">
                                    <h3>${file.title}</h3>
                                    <p>Cập nhật bởi SAMM X MODZ</p>
                                    <a href="${file.link}" target="_blank" onclick="checkLogin(event)">TẢI XUỐNG</a>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch(e) { console.log("Lỗi tải file"); }
        }
        loadFiles();

        // XỬ LÝ NHẠC NỀN NỔI (PICTURE-IN-PICTURE)
        let isMusicOn = false;
        async function toggleMusic() {
            const video = document.getElementById('bg-video');
            const btn = document.getElementById('musicBtn');

            if (!isMusicOn) {
                try {
                    video.muted = false;
                    await video.play();
                    
                    // Thủ thuật: Đưa video ra một cửa sổ nổi nhỏ (PiP)
                    if (document.pictureInPictureEnabled && !video.disablePictureInPicture) {
                        await video.requestPictureInPicture();
                    }
                    
                    btn.innerText = "Tắt Nhạc";
                    btn.style.background = "var(--primary)";
                    btn.style.color = "#000";
                    isMusicOn = true;
                } catch (error) {
                    alert('Trình duyệt của bạn không hỗ trợ phát nhạc nổi. Hãy bấm vào màn hình để phát nhạc bình thường.');
                    video.play();
                    isMusicOn = true;
                    btn.innerText = "Tắt Nhạc";
                }
            } else {
                video.pause();
                video.muted = true;
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                }
                btn.innerText = "Bật Nhạc";
                btn.style.background = "rgba(255, 0, 85, 0.2)";
                btn.style.color = "var(--secondary)";
                isMusicOn = false;
            }
        }

        // Xử lý Đăng Nhập/Đăng Ký
        async function submitAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const isRegister = document.getElementById('modalTitle').innerText.includes('ĐĂNG KÝ');
            if (!username || !password) return alert('Nhập đủ thông tin!');
            
            try {
                const res = await fetch(API_URL + (isRegister ? '/api/register' : '/api/login'), {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.message);
                    if (!isRegister) {
                        document.getElementById('displayUsername').innerText = username;
                        document.getElementById('displayStatus').innerText = 'Đã đăng nhập';
                        document.getElementById('displayStatus').style.color = 'var(--primary)';
                        document.getElementById('authButtons').innerHTML = `<button class="btn-music" onclick="toggleMusic()" id="musicBtn">Bật Nhạc</button><button onclick="location.reload()" style="border-color: #ff4444; color: #ff4444;">Đăng Xuất</button>`;
                    }
                    closeModal();
                } else { alert(data.error); }
            } catch (error) { alert('Lỗi kết nối Server (Vui lòng đợi 30s và thử lại)!'); }
        }

        function openModal(type) { document.getElementById('authModal').style.display = 'flex'; document.getElementById('modalTitle').innerText = type.toUpperCase(); }
        function closeModal() { document.getElementById('authModal').style.display = 'none'; }
        function checkLogin(e) {
            if (document.getElementById('displayStatus').innerText.includes('Chưa')) {
                if(e) e.preventDefault();
                alert('Vui lòng Đăng nhập để tải file!');
            }
        }

        function toggleChat() { var chat = document.getElementById('chatWindow'); chat.style.display = chat.style.display === 'block' ? 'none' : 'block'; }
        function handleChat(e) { if (e.key === 'Enter') sendChat(); }
        function sendChat() {
            var msg = document.getElementById('chatInput').value.trim(); if(!msg) return;
            var body = document.getElementById('chatBody');
            body.innerHTML += `<div class="chat-msg user">${msg}</div>`;
            document.getElementById('chatInput').value = '';
            setTimeout(() => {
                if (msg.toLowerCase() === '/start') body.innerHTML += `<div class="chat-msg bot"><b>SHOP SAMM X MODZ</b><br>- ZALO: 0355757211</div>`;
                else body.innerHTML += `<div class="chat-msg bot">Gõ /start nhé!</div>`;
                body.scrollTop = body.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
