<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - SAMM X MODZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ffcc; --bg-dark: #0a0a0a; --panel-bg: #151515; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg-dark); color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1, h2 { font-family: 'Orbitron'; color: var(--primary); text-align: center; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        .panel { background: var(--panel-bg); border: 1px solid rgba(0,255,204,0.2); border-radius: 15px; padding: 25px; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: #000; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Orbitron'; width: 100%; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 15px var(--primary); }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; }
        th { color: var(--primary); font-family: 'Orbitron'; font-weight: 500; }
        .badge { background: rgba(0,255,204,0.2); color: var(--primary); padding: 3px 8px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>QUẢN TRỊ VIÊN SAMM X MODZ</h1>
    
    <!-- Form thêm file -->
    <div class="panel">
        <h2>THÊM FILE MỚI</h2>
        <div class="form-group">
            <label>Tên File / Tên Game:</label>
            <input type="text" id="fileName" placeholder="Ví dụ: Aim Hack FF V2">
        </div>
        <div class="form-group">
            <label>Link Ảnh (URL):</label>
            <input type="text" id="fileImage" placeholder="https://... (Dán link ảnh vào đây)">
        </div>
        <div class="form-group">
            <label>Link Tải File (Google Drive, v.v.):</label>
            <input type="text" id="fileLink" placeholder="https://...">
        </div>
        <button onclick="addFile()">CẬP NHẬT LÊN WEB</button>
    </div>

    <!-- Danh sách User -->
    <div class="panel">
        <h2>TẤT CẢ TÀI KHOẢN TRUY CẬP</h2>
        <table>
            <thead>
                <tr>
                    <th>Tài khoản (Username)</th>
                    <th>Mật khẩu</th>
                    <th>Trạng thái</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Data load từ server vào đây -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'https://samxmodz-api.onrender.com'; // SỬA LINK NÀY THÀNH LINK RENDER BACKEND CỦA BẠN

    // Hàm thêm File
    async function addFile() {
        const title = document.getElementById('fileName').value;
        const imageUrl = document.getElementById('fileImage').value;
        const link = document.getElementById('fileLink').value;

        if (!title || !link) return alert('Vui lòng nhập Tên file và Link tải!');

        try {
            const response = await fetch(API_URL + '/api/admin/add-file', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, imageUrl, link })
            });
            const data = await response.json();
            
            if(response.ok) {
                alert('Đã thêm file lên web thành công!');
                document.getElementById('fileName').value = '';
                document.getElementById('fileImage').value = '';
                document.getElementById('fileLink').value = '';
            } else {
                alert('Lỗi: ' + data.error);
            }
        } catch (e) {
            alert('Lỗi kết nối tới Backend!');
        }
    }

    // Hàm tải danh sách User
    async function loadUsers() {
        try {
            const response = await fetch(API_URL + '/api/admin/users');
            const users = await response.json();
            const tbody = document.getElementById('userTableBody');
            
            tbody.innerHTML = '';
            if(users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Chưa có ai đăng ký</td></tr>';
                return;
            }

            users.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.password}</td>
                        <td><span class="badge">Hoạt động</span></td>
                    </tr>
                `;
            });
        } catch (e) {
            document.getElementById('userTableBody').innerHTML = '<tr><td colspan="3" style="text-align:center; color: #ff4444;">Không thể kết nối Backend</td></tr>';
        }
    }

    // Chạy khi mở trang
    loadUsers();
</script>

</body>
</html>
