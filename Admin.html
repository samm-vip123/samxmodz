<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - SAMM X MODZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ffcc; --bg-dark: #0a0a0a; --panel-bg: #151515; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg-dark); color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1, h2 { font-family: 'Orbitron'; color: var(--primary); text-align: center; }
        .panel { background: var(--panel-bg); border: 1px solid rgba(0,255,204,0.2); border-radius: 15px; padding: 25px; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
        input:focus { border-color: var(--primary); outline: none; }
        button { background: var(--primary); color: #000; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Orbitron'; width: 100%; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 15px var(--primary); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--primary); font-family: 'Orbitron'; }
        .btn-del { background: #ff4444; color: white; padding: 5px 10px; width: auto; margin: 0; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>QUẢN TRỊ VIÊN</h1>
    
    <div class="panel">
        <h2>THÊM FILE MỚI</h2>
        <div class="form-group">
            <label>Tên File / Game:</label>
            <input type="text" id="fileName" placeholder="Ví dụ: Aim Hack FF V2">
        </div>
        <div class="form-group">
            <label>Link Ảnh (URL):</label>
            <input type="text" id="fileImage" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>Hoặc Tải File Trực Tiếp Lên Server:</label>
            <input type="file" id="fileUpload">
        </div>
        <div class="form-group">
            <label>Hoặc Dán Link Tải Ngoài (Google Drive...):</label>
            <input type="text" id="fileLink" placeholder="https://...">
        </div>
        <button onclick="addFile()" id="btnSave">CẬP NHẬT LÊN WEB</button>
    </div>

    <div class="panel">
        <h2>DANH SÁCH FILE</h2>
        <table>
            <thead><tr><th>Tên File</th><th>Lượt tải</th><th>Hành động</th></tr></thead>
            <tbody id="fileTableBody"></tbody>
        </table>
    </div>

    <div class="panel">
        <h2>TẤT CẢ TÀI KHOẢN</h2>
        <table>
            <thead><tr><th>Tài khoản</th><th>Mật khẩu</th></tr></thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'https://samxmodz-api.onrender.com'; // SỬA LINK NÀY

    async function addFile() {
        const title = document.getElementById('fileName').value;
        const imageUrl = document.getElementById('fileImage').value;
        const link = document.getElementById('fileLink').value;
        const fileUpload = document.getElementById('fileUpload').files[0];

        if (!title) return alert('Nhập Tên File!');
        if (!link && !fileUpload) return alert('Vui lòng chọn File tải lên hoặc nhập Link!');

        const formData = new FormData();
        formData.append('title', title);
        formData.append('imageUrl', imageUrl);
        formData.append('link', link);
        if (fileUpload) formData.append('fileUpload', fileUpload);

        const btn = document.getElementById('btnSave');
        btn.innerText = "ĐANG TẢI LÊN...";
        btn.disabled = true;

        try {
            const res = await fetch(API_URL + '/api/admin/add-file', {
                method: 'POST',
                body: formData // Dùng FormData để gửi file
            });
            const data = await res.json();
            if(res.ok) {
                alert(data.message);
                document.getElementById('fileName').value = '';
                document.getElementById('fileImage').value = '';
                document.getElementById('fileLink').value = '';
                document.getElementById('fileUpload').value = '';
                loadFiles();
            } else alert(data.error);
        } catch (e) { alert('Lỗi kết nối Server!'); }
        finally { btn.innerText = "CẬP NHẬT LÊN WEB"; btn.disabled = false; }
    }

    async function deleteFile(id) {
        if(!confirm('Xóa file này?')) return;
        try {
            const res = await fetch(`${API_URL}/api/admin/delete-file/${id}`, { method: 'DELETE' });
            if(res.ok) { alert('Đã xóa!'); loadFiles(); }
        } catch (e) { alert('Lỗi xóa!'); }
    }

    async function loadFiles() {
        try {
            const res = await fetch(API_URL + '/api/files');
            const files = await res.json();
            const tbody = document.getElementById('fileTableBody');
            tbody.innerHTML = files.length ? '' : '<tr><td colspan="3">Chưa có file nào</td></tr>';
            
            files.forEach(f => {
                tbody.innerHTML += `
                    <tr>
                        <td>${f.title}</td>
                        <td>${f.downloads || 0}</td>
                        <td><button class="btn-del" onclick="deleteFile('${f.id || f._id}')">Xóa</button></td>
                    </tr>
                `;
            });
        } catch (e) { console.log(e); }
    }

    async function loadUsers() {
        try {
            const res = await fetch(API_URL + '/api/admin/users');
            const users = await res.json();
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = users.length ? '' : '<tr><td colspan="2">Chưa có ai đăng ký</td></tr>';
            users.forEach(u => {
                tbody.innerHTML += `<tr><td><strong>${u.username}</strong></td><td>${u.password}</td></tr>`;
            });
        } catch (e) { console.log(e); }
    }

    loadFiles();
    loadUsers();
</script>
</body>
</html>
