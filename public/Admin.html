<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROXY VIP - ADMIN PANEL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: #05010f; color: #fff; font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
    
    .admin-box {
        width: 100%; max-width: 900px;
        background: rgba(10, 4, 26, 0.9);
        border: 1px solid rgba(168, 85, 247, 0.4);
        border-radius: 16px; padding: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    h1 { font-family: 'Orbitron', sans-serif; text-align: center; color: #22d3ee; margin-bottom: 20px; letter-spacing: 2px; }

    #loginSection { text-align: center; padding: 40px 0; }
    .input-group { display: flex; gap: 10px; max-width: 400px; margin: 0 auto; }
    input, select {
        padding: 14px; border-radius: 8px; border: 1px solid rgba(168,85,247,0.5);
        background: rgba(0,0,0,0.5); color: #fff; font-family: 'Orbitron', sans-serif; outline: none;
    }
    input { flex: 1; width: 100%; }
    button {
        padding: 14px 20px; border: none; border-radius: 8px;
        background: linear-gradient(135deg, #a855f7, #22d3ee);
        color: #000; font-weight: 900; font-family: 'Orbitron', sans-serif;
        cursor: pointer; transition: 0.2s;
    }
    button:hover { opacity: 0.8; transform: translateY(-2px); }

    #adminSection { display: none; }
    .toolbar {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(168,85,247,0.2);
    }
    .toolbar .actions { display: flex; gap: 10px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { background: rgba(168,85,247,0.1); color: #22d3ee; font-family: 'Orbitron', sans-serif; font-size: 11px; }
    tr:hover { background: rgba(255,255,255,0.02); }
    
    .key-text { font-family: 'Orbitron', sans-serif; color: #fff; font-weight: 700; letter-spacing: 1px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .badge.on { background: rgba(34,211,238,0.2); color: #22d3ee; }
    .badge.off { background: rgba(255,77,109,0.2); color: #ff4d6d; }
    
    .btn-del { background: transparent; color: #ff4d6d; font-size: 16px; padding: 4px 8px; border: 1px solid transparent; }
    .btn-del:hover { border-color: #ff4d6d; background: rgba(255,77,109,0.1); }

    .modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
        align-items: center; justify-content: center; z-index: 999;
    }
    .modal.show { display: flex; }
    .modal-content {
        background: #0a041a; padding: 30px; border-radius: 12px;
        border: 1px solid #22d3ee; text-align: center; max-width: 400px; width: 90%;
    }
    .modal-content h3 { margin-bottom: 15px; color: #22d3ee; }
    .modal-content input, .modal-content select { margin-bottom: 15px; width: 100%; }
    .expired { color: #ff4d6d; font-size: 11px; }
</style>
</head>
<body>

<div class="admin-box">
    <h1><i class="fas fa-shield-haltered"></i> ADMIN PANEL</h1>

    <div id="loginSection">
        <p style="margin-bottom: 15px; color: #aaa;">Nhập mật khẩu để truy cập</p>
        <div class="input-group">
            <input type="password" id="passInput" placeholder="Mật khẩu Admin...">
            <button onclick="login()">ĐĂNG NHẬP</button>
        </div>
        <p id="loginError" style="color: #ff4d6d; margin-top: 10px; display: none;">Sai mật khẩu!</p>
    </div>

    <div id="adminSection">
        <div class="toolbar">
            <div>
                <span>Tổng Key: </span>
                <strong id="totalKeys" style="color: #22d3ee; font-size: 18px;">0</strong>
            </div>
            <div class="actions">
                <button onclick="openModal()"><i class="fas fa-plus"></i> TẠO KEY</button>
                <button onclick="logout()" style="background: #333; color: #fff;"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>KEY</th>
                    <th>NGÀY TẠO</th>
                    <th>HẠN SỬ DỤNG</th>
                    <th>LƯỢT DÙNG</th>
                    <th>NGUỒN</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="keyTable"></tbody>
        </table>
    </div>
</div>

<div class="modal" id="createModal">
    <div class="modal-content">
        <h3><i class="fas fa-key"></i> TẠO KEY MỚI</h3>
        
        <select id="typeInput" style="margin-bottom: 10px;">
            <option value="hour">1 Giờ (Hour)</option>
            <option value="day" selected>1 Ngày (Day)</option>
            <option value="week">1 Tuần (Week)</option>
            <option value="month">1 Tháng (Month)</option>
            <option value="lifetime">Vĩnh Viễn (Lifetime)</option>
        </select>

        <p style="margin-bottom: 10px; font-size: 13px; color: #aaa;">Số lượng muốn tạo (Tối đa 100)</p>
        <input type="number" id="amountInput" value="1" min="1" max="100">
        
        <div style="display: flex; gap: 10px;">
            <button onclick="closeModal()" style="flex: 1; background: #333; color: #fff;">HỦY</button>
            <button onclick="createKeys()" style="flex: 1;">TẠO NGAY</button>
        </div>
    </div>
</div>

<script>
    let adminPass = "";
    const API_BASE = window.location.origin;

    function login() {
        const pass = document.getElementById('passInput').value;
        if(!pass) return;
        
        fetch(`${API_BASE}/api/admin/keys`, {
            headers: { 'x-admin-password': pass }
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                adminPass = pass;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                renderKeys(data.keys);
            } else {
                showError();
            }
        })
        .catch(() => showError());
    }

    function showError() {
        const el = document.getElementById('loginError');
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    function logout() { location.reload(); }

    function renderKeys(keys) {
        document.getElementById('totalKeys').innerText = keys.length;
        const tbody = document.getElementById('keyTable');
        tbody.innerHTML = "";

        if(keys.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#666;">Chưa có key nào</td></tr>`;
            return;
        }

        keys.forEach(k => {
            const date = new Date(k.createdAt).toLocaleString('vi-VN');
            const source = k.deviceId === 'ADMIN_CREATED' ? '<span style="color:#a855f7;">Admin</span>' : 'Free';
            
            let expText = 'Vĩnh viễn';
            let isExpired = false;
            if(k.expiresAt) {
                expText = new Date(k.expiresAt).toLocaleString('vi-VN');
                if(Date.now() > k.expiresAt) {
                    isExpired = true;
                    expText = `<span class="expired">Đã hết hạn</span>`;
                }
            }

            tbody.innerHTML += `
                <tr>
                    <td class="key-text">${k.key}</td>
                    <td style="font-size: 12px; color: #aaa;">${date}</td>
                    <td style="font-size: 12px;">${expText}</td>
                    <td style="text-align: center; font-weight: bold; color: #22d3ee;">${k.usedCount || 0}</td>
                    <td>${source}</td>
                    <td style="text-align: right;">
                        <button class="btn-del" onclick="deleteKey('${k.key}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    function openModal() { document.getElementById('createModal').classList.add('show'); }
    function closeModal() { document.getElementById('createModal').classList.remove('show'); }

    function createKeys() {
        const amount = document.getElementById('amountInput').value;
        const type = document.getElementById('typeInput').value;
        
        fetch(`${API_BASE}/api/admin/create`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPass },
            body: JSON.stringify({ amount, type })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                closeModal();
                alert(`Đã tạo thành công ${amount} key!`);
                reloadData();
            } else {
                alert(data.message);
            }
        });
    }

    function deleteKey(key) {
        if(!confirm(`Bạn có chắc muốn xóa key: ${key}?`)) return;

        fetch(`${API_BASE}/api/admin/delete/${key}`, {
            method: 'DELETE',
            headers: { 'x-admin-password': adminPass }
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) reloadData();
            else alert(data.message);
        });
    }

    function reloadData() {
        fetch(`${API_BASE}/api/admin/keys`, { headers: { 'x-admin-password': adminPass } })
        .then(res => res.json())
        .then(data => { if(data.success) renderKeys(data.keys); });
    }
</script>
</body>
</html>
